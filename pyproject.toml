[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cews"
version = "0.1.0"
description = "Competitor Early Warning System: local, explainable competitive intelligence for life sciences"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "tzdata>=2024.1,<2100",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    "feedparser>=6.0,<7",
    "defusedxml>=0.7,<1",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.3,<2",
    "statsmodels>=0.14,<1",
    "rapidfuzz>=3.6,<4",
    "APScheduler>=3.10,<4",
    "portalocker>=2.8,<4",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "streamlit>=1.32,<2",
    "matplotlib>=3.8,<4",
    "Jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
ai = [
    "sentence-transformers>=2.7,<6",
]
mcp = [
    "mcp>=1.2,<2",
    "pypdf>=4.0,<6",
    "python-docx>=1.1,<2",
]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "pytest-mock>=3.12,<4",
    "responses>=0.25,<1",
    "respx>=0.21,<1",
    "freezegun>=1.4,<2",
    "hypothesis>=6.100,<7",
    "ruff>=0.4,<1",
    "black>=24.0,<27",
    "mypy>=1.9,<2",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
cews = "cews.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Black wraps code; long user-facing strings and templates are allowed.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Alembic generates these files in its own style.
"migrations/versions/*.py" = ["UP007", "UP035", "I001"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/cews"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
