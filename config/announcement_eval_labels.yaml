# Hand-labelled announcements for evaluating announcement classification (Phase 11c).
# All companies and products are invented. The wording is deliberately varied and natural:
# it was written to look like real press-release headlines, NOT to match the keyword rules,
# so measured accuracy reflects how the classifier copes with ordinary phrasing.
#
# Label definitions used:
#   licensing          rights to a product or technology are granted to another party
#   partnership        a collaboration or joint effort, with no transfer of rights or ownership
#   acquisition        one company buys, or merges with, another
#   funding            money is raised (financing round, IPO, placement, grant)
#   clinical_milestone a trial starts, enrolls, or reports data
#   regulatory         an approval, clearance, designation or filing with a regulator
#   other              anything else (people, sites, earnings, events)
announcements:
  # ---- licensing ----
  - {id: L1, label: licensing, text: "Varethyn Labs grants Orvexa Bio exclusive rights to its oral kinase inhibitor in Asia in exchange for an upfront payment and royalties"}
