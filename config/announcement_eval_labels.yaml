  - {id: L3, label: licensing, text: "Zentavia Pharma in-licenses a preclinical antibody program from Kestrel Therapeutics"}
  - {id: L4, label: licensing, text: "Mirandel Bio secures worldwide commercial rights to a rare disease enzyme therapy from Talvora Sciences"}
  - {id: L5, label: licensing, text: "Quillon Health licenses its diagnostic algorithm to Brannock Diagnostics for a milestone-based fee"}
